[package]
name    = "ml"
version = "0.4.0"
entry   = "src/lib.vani"
authors = "enthusiasticgeek"
license = "MIT"
description = "Machine learning for vāṇी: classical ML first (linear/logistic regression, k-means, metrics), staged toward an autodiff + neural-net engine (v0.3.0+). See kosh-index/ROADMAP.md's 'vani-ml scoping breakdown'."
registry = "kosh"

[deps]
# v0.1.0 (classical ML) needs both of these. Vendored 2026-07-25 via
# `vanic vendor` (which copied from the local sibling checkouts into
# vendor/<name>/); path rewritten to ./vendor/<name> by hand afterward to
# match every other package's committed vani.toml (vani-optimize's,
# vani-algebra's) -- `vanic vendor` itself doesn't rewrite the source path.
probability = { path = "./vendor/probability", version = "^0.4.2" }
optimize    = { path = "./vendor/optimize", version = "^0.1.4" }

# calculus: vendored via `vanic add calculus` for v0.3.0's tests ONLY --
# production graph_forward/graph_backward have zero calculus:: calls.
# Its diff_central (central-difference numeric derivative) is the
# reference tests/test_graph_core.vani cross-checks graph_backward's
# analytic gradients against, matching vani-symbolic's own v0.3.0
# precedent (same cross-check, same function, different repo).
#
# matrix/tensor deliberately NOT added yet -- v0.3.0's node arena stores
# one f64 per node directly, never touching vani-tensor's N-D
# functionality; that's a real v0.4.0 concern (dense/matmul layers), not
# this phase's. Add when v0.4.0 actually needs it, matching this
# ecosystem's "only declare what the current phase actually uses"
# convention (see vani-optimize's vani.toml for the same discipline).
calculus = { path = "./vendor/calculus", version = "^0.3.1" }
